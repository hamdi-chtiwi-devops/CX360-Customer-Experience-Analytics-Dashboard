[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
env =
    SECRET_KEY=testsecretkeyforpytest_some_very_long_and_random_string_for_testing_jwt
    ALGORITHM=HS256
    ACCESS_TOKEN_EXPIRE_MINUTES=30
    # Using a separate test database is crucial
    # For this subtask, we'll aim to mock DB interactions for route tests
    # and test service logic directly.
    # If actual DB testing is needed:
    # DATABASE_URL=sqlite:///./test.db
    # For now, we'll rely on overriding get_db in tests for route testing if needed
    # Or ensure services don't hit a live DB during unit tests.
    # Setting a dummy DATABASE_URL here can prevent accidental connection to a real dev DB if code tries to load it on import.
    DATABASE_URL=sqlite:///./test_dummy_for_config_load.db
